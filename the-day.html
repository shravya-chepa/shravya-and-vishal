</g>

<script>
/* ---------------- the day: bento, schedule, cards ---------------- */
(function day() {
  /* at a glance: six matching cards */
  const G = [
    ["Ceremony", CONFIG.ceremonyLabel, "Pacific time · please arrive by 3:30"],
    ["Venue", CONFIG.venue.name, CONFIG.venue.address],
    ["Getting there", "Fly into SNA or LAX", "John Wayne (SNA): about 25 min\nLAX: about an hour, more with traffic"],
    ["Parking", "On site and on the street", "18 spots at the venue, plus easy street parking nearby"],
    ["Dress code", CONFIG.dressCode, "Evenings dip to about 50°F, so bring a layer"],
    ["Kindly reply", `By ${CONFIG.rsvpBy.replace(/,\s*\d{4}$/, "")}`, "RSVP on Zola", "rsvp.html"]
  ];
  $("#glance").innerHTML = G.map(([l, v, n, href], i) => `<div class="gcard reveal" style="transition-delay:${i * .07}s"><span class="lab" data-l="${esc(l)}">${esc(l)}</span><i class="orn" aria-hidden="true"></i><span class="val">${esc(v)}</span><span class="note">${href ? `<a href="${href}">${esc(n)}</a>` : esc(n).replace(/\n/g, "<br>")}</span></div>`).join("");

  /* two butterflies, one blush and one aqua, who drift in and rest on the cards */
  (function butterflies() {
    const host = $("#glance");
    // a slender swallowtail drawn once for the left side and mirrored for the right
    // a slender swallowtail drawn once for the left side and mirrored for the right
    const WING = (id, edge) => `
        <path d="M-1.4-3C-6-14-16-25-29-23c-2.4 7 .6 15 11 19.5 6 2.5 11.6 1.6 16.6.5z" fill="url(#${id}f)"/>
        <path d="M-1.4.6C-7 1.2-16 3.6-19 10.6c-1.6 4.6 1.4 7.6 5.2 6.8.8 3.6 2.6 7.4 5 10-.2-4.6.6-9 2.2-12.8 1.8-4.4 3.4-9.2 5.2-14z" fill="url(#${id}h)"/>
        <path d="M-3-3.2C-9-9-15-15.5-24-20.5M-3.4-2.4C-10-5.6-17-7.8-26.6-8.4M-3 1.8C-7.6 5.2-11 9.4-13.6 15M-2.6 2.4C-4.6 8-6.4 14-7.6 22" fill="none" stroke="${edge}" stroke-width=".42" opacity=".45" stroke-linecap="round"/>
        <path d="M-1.4-3C-6-14-16-25-29-23c-2.4 7 .6 15 11 19.5" fill="none" stroke="${edge}" stroke-width="1.6" opacity=".18" stroke-linecap="round"/>
        <path d="M-6-17C-12-22-20-24-26-21" fill="none" stroke="${edge}" stroke-width=".8" opacity=".25" stroke-linecap="round"/>
        <circle cx="-17.5" cy="-12.5" r="2.3" fill="#FFFBF2" opacity=".85"/><circle cx="-17.5" cy="-12.5" r="1" fill="${edge}" opacity=".5"/>
        <circle cx="-25.6" cy="-19" r=".7" fill="#E9C987"/><circle cx="-27.2" cy="-14.6" r=".7" fill="#E9C987"/><circle cx="-25.4" cy="-10" r=".7" fill="#E9C987"/>
        <circle cx="-15.4" cy="13.4" r=".75" fill="#E9C987"/><circle cx="-11.6" cy="16.6" r=".6" fill="#E9C987"/>`;
    const wing = (c1, c2, edge, id) => `<svg viewBox="-32 -28 64 60" aria-hidden="true">
      <defs>
        <linearGradient id="${id}f" x1="0" y1="0" x2="-29" y2="-22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${c2}"/><stop offset=".5" stop-color="${c1}"/><stop offset="1" stop-color="${edge}" stop-opacity=".85"/></linearGradient>
        <linearGradient id="${id}h" x1="0" y1="0" x2="-14" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${c2}"/><stop offset=".7" stop-color="${c1}"/><stop offset="1" stop-color="${edge}" stop-opacity=".7"/></linearGradient>
        <linearGradient id="${id}b" x1="-1.2" y1="0" x2="1.2" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3B2B2E"/><stop offset=".45" stop-color="#7A5F62"/><stop offset="1" stop-color="#3B2B2E"/></linearGradient>
      </defs>
      <g class="wl">${WING(id, edge)}</g>
      <g class="wr"><g transform="scale(-1 1)">${WING(id, edge)}</g></g>
      <path d="M-.7-10C-2.4-16-4.6-20.6-7.4-23M.7-10C2.4-16 4.6-20.6 7.4-23" fill="none" stroke="#5A4245" stroke-width=".4" stroke-linecap="round"/>
      <circle cx="-7.4" cy="-23" r=".75" fill="#4A3336"/><circle cx="7.4" cy="-23" r=".75" fill="#4A3336"/>
      <ellipse cx="0" cy="2" rx="1.15" ry="10.5" fill="url(#${id}b)"/><circle cx="0" cy="-9" r="1.5" fill="#5A4245"/>
    </svg>`;
    const kinds = [["#E0959A", "#F2C7BE", "#6E1F2C"], ["#64847E", "#B4D3CD", "#294845"]];   // blush, and a deep sea green
    const B = kinds.map(([a, b, e], i) => {
      const el = document.createElement("button");
      el.className = "bfly"; el.type = "button"; el.setAttribute("aria-label", i ? "Blue butterfly" : "Pink butterfly");
      el.innerHTML = wing(a, b, e, "bw" + i); host.appendChild(el);
      return { el, x: 0, y: 0, rot: 0, state: "away", card: -1, anim: null };
    });
    const cards = () => $$(".gcard", host);
    const hostRect = () => host.getBoundingClientRect();
    // a resting spot on any edge of a card; kept as (card, edge, fraction) so it survives resizes
    function spotXY(sp) {
      const r = cards()[sp.card].getBoundingClientRect(), h = hostRect(), L = r.left - h.left, T = r.top - h.top;
      if (sp.edge === "top") return { x: L + r.width * sp.f, y: T + 2 };
      if (sp.edge === "bottom") return { x: L + r.width * sp.f, y: T + r.height + 30 };
      if (sp.edge === "left") return { x: L - 4, y: T + r.height * sp.f + 22 };
      return { x: L + r.width + 4, y: T + r.height * sp.f + 22 };
    }
    const ROT = { top: [-18, 18], bottom: [162, 198], left: [-104, -76], right: [76, 104] };
    function makeSpot(card, edge) {
      const [a, z] = ROT[edge]; return { card, edge, f: .2 + Math.random() * .6, rot: a + Math.random() * (z - a) };
    }
    // which cards sit in the top half of the grid and which in the bottom half
    function halves() {
      const cs = cards(), h = hostRect(), mid = h.top + h.height / 2, top = [], bot = [];
      cs.forEach((c, i) => { const r = c.getBoundingClientRect(); (r.top + r.height / 2 < mid ? top : bot).push(i); });
      return [top.length ? top : [0], bot.length ? bot : [cs.length - 1]];
    }
    // the whole butterfly must stay on screen: keep its centre this far from the viewport's sides
    const MARGIN = 46;
    const onScreen = p => { const vx = hostRect().left + p.x; return vx > MARGIN && vx < innerWidth - MARGIN; };
    function safeTop(card) {                    // a top-edge spot, nudged inward if the card runs close to the screen edge
      const sp = makeSpot(card, "top"), r = cards()[card].getBoundingClientRect(), lo = (MARGIN - r.left) / r.width, hi = (innerWidth - MARGIN - r.left) / r.width;
      sp.f = Math.min(Math.max(sp.f, Math.max(.12, lo)), Math.min(.88, hi)); return sp;
    }
    // anywhere around the cards, but never right next to the other butterfly, and always fully visible
    function anywhere(b) {
      const n = cards().length, other = B.find(o => o !== b);
      for (let k = 0; k < 24; k++) {
        const r = Math.random(), edge = r < .4 ? "top" : r < .6 ? "bottom" : r < .8 ? "left" : "right";
        const sp = makeSpot(Math.floor(Math.random() * n), edge), p = spotXY(sp);
        if (!onScreen(p)) continue;
        if (!other || other.state === "away" || Math.hypot(p.x - other.x, p.y - other.y) > 110) return sp;
      }
      return safeTop(Math.floor(Math.random() * n));
    }
    function place(b) { b.el.style.transform = `translate(${b.x}px,${b.y}px) rotate(${b.rot}deg)`; }
    function fly(b, to, ms, then) {               // curved, wobbling flight; can be redirected mid-air without a jolt
      const mid = b.state === "flying";
      cancelAnimationFrame(b.anim); b.state = "flying"; b.el.classList.add("flying"); b.el.classList.remove("resting");
      const x0 = b.x, y0 = b.y, r0 = b.rot, dx = to.x - x0, dy = to.y - y0, len = Math.hypot(dx, dy) || 1;
      let cx, cy;
      const sp = Math.hypot(b.vx || 0, b.vy || 0);
      if (mid && sp > .01) {                        // already flying: carry on in the current direction, then curve toward the new spot
        const reach = Math.min(170, len * .55); cx = x0 + b.vx / sp * reach; cy = y0 + b.vy / sp * reach;
      } else {
        const bend = (Math.random() < .5 ? -1 : 1) * Math.min(160, len * .45), nx = -dy / len, ny = dx / len;
        cx = x0 + dx / 2 + nx * bend; cy = y0 + dy / 2 + ny * bend - 40;
      }
      const t0 = performance.now();
      const pt = t => [(1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * to.x, (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * to.y];
      const ease = mid ? (k => 1 - Math.pow(1 - k, 2.2)) : (k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
      let px = x0, py = y0;
      (function step(now) {
        const k = Math.min(1, (now - t0) / ms), t = ease(k);
        const [x, y] = pt(t), [x2, y2] = pt(Math.min(1, t + .02));
        b.x = x + Math.sin(k * 18) * 6 * (1 - k); b.y = y + Math.sin(k * 14) * 5 * (1 - k);
        b.vx = b.x - px; b.vy = b.y - py; px = b.x; py = b.y;
        // turn smoothly toward the direction of travel, then toward the resting angle; never more than a few degrees a frame
        const head = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI + 90, want = k < .72 ? head : (to.rot ?? 0);
        const d = ((want - b.rot) % 360 + 540) % 360 - 180, gain = k < .72 ? .16 : k < .9 ? .22 : .4;
        b.rot += Math.max(-8, Math.min(8, d * gain));
        place(b);
        if (k < 1) b.anim = requestAnimationFrame(step); else { b.vx = b.vy = 0; b.el.classList.remove("flying"); then && then(); }
      })(t0);
    }
    // a butterfly only moves when it's clicked; a click mid-flight simply sends it somewhere new
    function land(b, sp) {
      b.spot = sp; const p = spotXY(sp); p.rot = sp.rot;
      fly(b, p, 1500 + Math.random() * 700, () => { b.state = "resting"; b.spot.rot = b.rot; place(b); b.el.classList.add("resting"); });
    }
    function edgePoint(fromLeft) { const h = hostRect(); return { x: fromLeft ? -80 : h.width + 80, y: -60 + Math.random() * h.height * .6 }; }
    function arrive(b, i, sp) { const e = edgePoint(i === 0); b.x = e.x; b.y = e.y; b.state = "flying"; b.el.hidden = false; place(b); setTimeout(() => land(b, sp), i * 450); }
    function flyAway(b) {
      const h = hostRect(), out = { x: Math.random() < .5 ? -120 : h.width + 120, y: -window.innerHeight * .6 };
      b.card = -1; fly(b, out, 1300, () => { b.state = "away"; b.el.hidden = true;
        setTimeout(() => { if (inView && b.state === "away") arrive(b, B.indexOf(b)); }, 6000); });
    }
    B.forEach(b => {
      b.el.hidden = true;
      b.el.addEventListener("click", e => { e.stopPropagation(); if (b.state !== "away") land(b, anywhere(b)); });   // a tap sends it fluttering to another card; it never leaves
    });
    // nudge: when the cursor comes close to a resting butterfly, it lifts off and settles elsewhere
    addEventListener("resize", () => B.forEach(b => {
      if (b.state !== "resting" || !b.spot) return;
      const p = spotXY(b.spot); if (!onScreen(p)) { land(b, anywhere(b)); return; }
      b.x = p.x; b.y = p.y; place(b);
    }));
    let inView = false, started = false;
    // first landing: one butterfly on either of the first two cards (top left), the other on either of the last two (bottom right).
    // on phones the cards stack in one column, so the second one lands on card 3 or 4 instead, close to the first.
    const oneCol = () => { const cs = cards(); return cs.length > 1 && Math.abs(cs[0].getBoundingClientRect().left - cs[1].getBoundingClientRect().left) < 2; };
    const begin = () => {
      if (started) return; started = true;
      const n = cards().length, pick = a => a[Math.floor(Math.random() * a.length)];
      // pink on one of the first two cards, blue on one of the last two. on a grid it's always a top-left to bottom-right diagonal
      const x = k => cards()[k].getBoundingClientRect().left, pairs = [];
      for (const a of [0, 1]) for (const z of [n - 2, n - 1]) if (oneCol() || x(z) > x(a) + 2) pairs.push([a, z]);

      road(ROADS.stAnn, 3.6, "rgba(226,160,150,A)");

      const sea = proj(along(aV - 300, -Math.min(900, km * 220)));
      ctx.globalAlpha = st; ctx.fillStyle = "#386B65"; ctx.font = 'italic 500 20px "EB Garamond", Georgia, serif'; ctx.textAlign = "center"; ctx.fillText("Pacific Ocean", sea[0], sea[1]); ctx.textAlign = "left"; ctx.globalAlpha = 1;
    }

    sh.addColorStop(0, "rgba(255,255,255,.22)"); sh.addColorStop(.55, "rgba(255,255,255,0)"); sh.addColorStop(1, "rgba(36,57,59,.32)");
    ctx.beginPath(); path(sphere); ctx.fillStyle = sh; ctx.fill();
    // stops along the way
    const dot = (pt, col, r) => { if (d3.geoDistance([lon, lat], pt) < 1.5) { const [x, y] = proj(pt); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.strokeStyle = "#FFFBF2"; ctx.lineWidth = 1.2; ctx.stroke(); } };
    dot(START, `rgba(56,107,101,${1 - e2})`, 3.5);
    // the flight path: an arc lifted off the globe; travelled part solid, the rest dotted
    const ra = 1 - smooth(.36, .5, p);
    if (ra > 0) {

      const seen = (t, pt) => d3.geoDistance([lon, lat], pt) < Math.PI / 2 + Math.acos(1 / (1 + lift(t)));

      seg(n, 120); ctx.setLineDash([2, 5]); ctx.strokeStyle = `rgba(139,44,58,${.8 * ra})`; ctx.lineWidth = 1.4; ctx.stroke(); ctx.setLineDash([]);
      if (n > 0) { seg(0, n); ctx.strokeStyle = `rgba(139,44,58,${.95 * ra})`; ctx.lineWidth = 2; ctx.stroke(); }
      if (e1 > 0 && e1 < 1 && seen(e1, journey(e1))) { const [x, y] = lifted(e1, journey(e1)); ctx.fillStyle = "#FFFBF2"; ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.283); ctx.fill(); ctx.fillStyle = "#8B2C3A"; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.283); ctx.fill(); }
    }
    // Laguna pin while flying in, then the clubhouse itself
    const bl = smooth(9, 4, km);
    if (d3.geoDistance([lon, lat], LAG) < 1.45) {
      const [x, y] = proj(LAG), k = (performance.now() / 1400) % 1;
      if (bl < 1) {
        ctx.globalAlpha = 1 - bl;
        ctx.strokeStyle = `rgba(139,44,58,${.7 * (1 - k)})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, 5 + k * 16, 0, 6.283); ctx.stroke();
        ctx.fillStyle = "#8B2C3A"; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 6.283); ctx.fill();
        ctx.strokeStyle = "#FFFBF2"; ctx.lineWidth = 1.5; ctx.stroke();
        const la = smooth(.3, .5, p);
        if (la > 0) { ctx.globalAlpha = la * (1 - bl); ctx.fillStyle = "#24393B"; ctx.font = 'italic 500 17px "EB Garamond", Georgia, serif'; ctx.fillText("Laguna Beach", x + 12, y - 10); }
        ctx.globalAlpha = 1;
      }
      if (bl > 0) {
        ctx.save(); ctx.globalAlpha = bl;
        ctx.strokeStyle = `rgba(139,44,58,${.55 * (1 - k)})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, 18 + k * 22, 0, 6.283); ctx.stroke();
        drawClub(x, y, clamp(1.05 + (3 - km) * .25, 1, 1.4));
        ctx.fillStyle = "#24393B"; ctx.font = 'italic 500 19px "EB Garamond", Georgia, serif'; ctx.fillText("The Woman's Club", x + 30, y - 4);
        ctx.fillStyle = "#55696B"; ctx.font = '500 9.5px Jost, system-ui, sans-serif'; if ("letterSpacing" in ctx) ctx.letterSpacing = "2.5px"; ctx.fillText("286 ST. ANN'S DRIVE", x + 31, y + 13); if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
        ctx.restore();

    }
  }
  // the venue marker: a small wax seal with the monogram
  function drawClub(x, y, k) {
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
    ctx.fillStyle = "rgba(36,57,59,.16)"; ctx.beginPath(); ctx.ellipse(1.5, 3, 15, 15, 0, 0, 6.283); ctx.fill();
    const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, 16); g.addColorStop(0, "#A8404F"); g.addColorStop(1, "#6E1F2C");
    ctx.fillStyle = g; ctx.beginPath();

    ctx.strokeStyle = "rgba(255,240,236,.45)"; ctx.lineWidth = .8; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 6.283); ctx.stroke();

    hint.textContent = e1 < .12 ? "India" : e1 < .45 ? "Toward Europe" : e1 < .75 ? "Across the Atlantic" : km > 2500 ? "North America" : km > 400 ? "Southern California" : km > 60 ? "Orange County coast" : km > 8 ? "Laguna Beach" : "St. Ann's Drive";

})();

/* the schedule heading stays pinned, and the beach scene pins right beneath it */
(function () {
  const head = $("#schedHead"), set = () => document.documentElement.style.setProperty("--sched-head", head.offsetHeight + "px");
  set(); addEventListener("resize", set); if (document.fonts) document.fonts.ready.then(set);
})();
/* keep the space between sections equal around the pinned map scene, whatever the screen height */
(function evenGaps() {
  const probe = document.createElement("div"); probe.style.cssText = "position:absolute;visibility:hidden;height:var(--sub-gap)"; document.body.appendChild(probe);
  const ms = $("#mapScene"), sticky = $(".map-sticky"), book = $("#bookSec"), tl = $("#timeline");
  function fit() {
    const G = probe.offsetHeight;
    ms.style.marginTop = "0px"; book.style.paddingTop = ""; book.style.marginTop = "";
    const kids = [...sticky.querySelectorAll(":scope > .wrap > *")].filter(e => e.offsetHeight);
    const head = sticky.querySelector(".sub-head"), last = sticky.querySelector(".map-links");
    const sTop = sticky.getBoundingClientRect().top;
    const above = head.getBoundingClientRect().top - sTop, below = sticky.offsetHeight - (last.getBoundingClientRect().bottom - sTop);
    const lastLi = tl.lastElementChild;
    const gapBefore = ms.getBoundingClientRect().top - lastLi.getBoundingClientRect().bottom;
    ms.style.marginTop = (G - gapBefore - above) + "px";
    book.style.paddingTop = Math.max(0, G - below) + "px"; book.style.marginTop = Math.min(0, G - below) + "px";
  }
  fit(); addEventListener("resize", fit); if (document.fonts) document.fonts.ready.then(fit); addEventListener("load", fit);
})();
/* ---------------- day scroll scenes: sky + map ---------------- */
(function () {
  const tl = $("#timeline"), tlFill = $("#tlFill"), tlItems = $$("#timeline li");
  const sky = $("#sky"), sun = $("#sun"), sunGlow = $("#sunGlow"), stars = $("#stars"), skyTime = $("#skyTime"), skyWhat = $("#skyWhat");
  const moon = $("#moon"), dusk = $("#dusk"), glint = $("#glint"), glint2 = $("#glint2"), palms = $("#palms");
  const mapScene = $("#mapScene");
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",")})`; };
  const mins = t => { const m = t.match(/(\d+):(\d+)\s*(AM|PM)/i); let h = +m[1] % 12; if (/PM/i.test(m[3])) h += 12; return h * 60 + +m[2]; };
  const fmt = m => { m = Math.round(m / 5) * 5; let h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(mm).padStart(2, "0")} ${ap}`; };
  const TIMES = CONFIG.schedule.map(s => mins(s.t));
  // sky colours by clock time: afternoon blue, golden, sunset at 4:47, dusk, dark by 7:30, fully dark by 9
  const SKY = [[930, "#AAD4C9", "#F3E8CB"], [975, "#C7DBD6", "#FBE6C2"], [995, "#F2C6B4", "#FBDDBE"], [1007, "#F2A7A9", "#F9C9A4"],
               [1030, "#9B8AA8", "#E7A6A2"], [1065, "#4D5A7C", "#A7849A"], [1170, "#1A2440", "#2E3858"], [1260, "#0A1222", "#111A2C"]];
  function skyAt(m) { if (m <= SKY[0][0]) return [SKY[0][1], SKY[0][2]]; for (let i = 1; i < SKY.length; i++) if (m <= SKY[i][0]) { const t = (m - SKY[i - 1][0]) / (SKY[i][0] - SKY[i - 1][0]); return [mix(SKY[i - 1][1], SKY[i][1], t), mix(SKY[i - 1][2], SKY[i][2], t)]; } const L = SKY[SKY.length - 1]; return [L[1], L[2]]; }
  const ramp = (m, pts) => { if (m <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++) if (m <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], (m - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0])); return pts[pts.length - 1][1]; };
  onScroll(() => {
    const vh = innerHeight, trig = vh * .6;
    // when the scene stops being pinned at the end of the schedule, the heading leaves with it
    { const hd = $("#schedHead"), want = hd.offsetHeight + (innerWidth > 860 ? 8 : 0), top = sky.getBoundingClientRect().top - (parseFloat(getComputedStyle(sky).top) - want);
      const lift = Math.min(0, sky.getBoundingClientRect().top - parseFloat(getComputedStyle(sky).top));
      hd.style.transform = lift < 0 ? `translateY(${lift}px)` : ""; }
    let r = tl.getBoundingClientRect();
    // anything in the timeline that has scrolled up past the pinned heading (desktop) or the pinned scene (phones) is cut away
    // anything scrolling up under the pinned heading (desktop) or the pinned scene (tablets, phones) fades out softly before it gets there
    { const wide = innerWidth > 860, barrier = wide ? $("#schedHead").getBoundingClientRect().bottom - 8 : sky.getBoundingClientRect().bottom + 18;
      const cut = Math.max(0, barrier - r.top), fade = wide ? 34 : 40;
      const m = cut > 0 ? `linear-gradient(to bottom, transparent ${cut}px, #000 ${cut + fade}px)` : "";
      tl.style.clipPath = ""; tl.style.webkitMaskImage = m; tl.style.maskImage = m; }
    const ps = REDUCED ? 0 : clamp((trig - r.top) / r.height);
    tlFill.style.transform = `scaleY(${ps})`;
    // clock time follows the trigger line through the schedule, easing between items
    const tops = tlItems.map(li => li.getBoundingClientRect().top);
    let ai = 0, m = TIMES[0];
    tlItems.forEach((li, i) => { const on = tops[i] < trig; li.classList.toggle("on", on || REDUCED); if (on) ai = i; });
    if (!REDUCED) {
      if (tops[0] >= trig) m = TIMES[0];
      else if (ai >= TIMES.length - 1) m = TIMES[TIMES.length - 1];
      else m = lerp(TIMES[ai], TIMES[ai + 1], clamp((trig - tops[ai]) / (tops[ai + 1] - tops[ai])));
    }
    const [c1, c2] = skyAt(m); sky.style.setProperty("--sky1", c1); sky.style.setProperty("--sky2", c2);
    sky.style.setProperty("--sky-ink", m > 1022 ? "#FBF6EA" : "#24393B");
    // the sun slides from high on the left to below the sea horizon on the right, setting at 4:47
    const k = clamp((m - 930) / (1007 - 930)), sx = lerp(150, 300, k), sy = lerp(120, 330, Math.pow(k, 1.35)) + (m > 1007 ? (m - 1007) * 1.6 : 0);
    sun.setAttribute("cx", sx); sun.setAttribute("cy", sy); sunGlow.setAttribute("cx", sx); sunGlow.setAttribute("cy", sy);
    sun.setAttribute("fill", mix("#FFF4DE", "#FFB98F", smooth(970, 1007, m)));
    const low = smooth(975, 1000, m) * (1 - smooth(1008, 1022, m));
    glint.setAttribute("cx", sx); glint.setAttribute("opacity", (.85 * low).toFixed(2));
    glint2.setAttribute("transform", `translate(${sx - 300} 0)`); glint2.setAttribute("opacity", (.6 * low).toFixed(2));
    const night = ramp(m, [[1007, 0], [1040, .3], [1170, .72], [1260, .9]]);
    dusk.setAttribute("opacity", night.toFixed(3)); palms.setAttribute("color", mix("#7E9C8A", "#1A2333", night / .9));
    stars.setAttribute("opacity", ramp(m, [[1025, 0], [1100, .45], [1170, .85], [1260, 1]]).toFixed(2));
    moon.setAttribute("opacity", ramp(m, [[1080, 0], [1170, .9], [1260, 1]]).toFixed(2));
    skyTime.textContent = REDUCED ? CONFIG.schedule[ai].t : fmt(m); skyWhat.textContent = CONFIG.schedule[ai].h;
    r = mapScene.getBoundingClientRect();
    const pm = REDUCED ? 1 : clamp(-r.top / (r.height - vh));
    if (GLOBE) GLOBE.set(pm); else MAP.set(pm);
  });
})();
